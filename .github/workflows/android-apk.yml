name: Build ALFACAR Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'index.html'
      - 'cloud-sync.js'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar ícone com a logomarca original ALFACAR
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          import base64
          from io import BytesIO
          from pathlib import Path
          from PIL import Image
          raw = base64.b64decode(Path("app/src/main/assets/alfacar-logo.b64").read_text().strip())
          logo = Image.open(BytesIO(raw)).convert("RGBA")
          logo.thumbnail((460, 190), Image.Resampling.LANCZOS)
          canvas = Image.new("RGBA", (512, 512), (255, 255, 255, 255))
          canvas.alpha_composite(logo, ((512 - logo.width) // 2, (512 - logo.height) // 2))
          out = Path("app/src/main/res/drawable-nodpi")
          out.mkdir(parents=True, exist_ok=True)
          canvas.save(out / "alfacar_logo.png", optimize=True)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Incluir sincronização na nuvem
        run: cp cloud-sync.js app/src/main/assets/www/cloud-sync.js

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALFACAR-APK-Android-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
